<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ChatCRM — Inbox stack">
  <title>Inbox stack</title>
  <!-- Conversations stacked: a clean cut separates the front chat card from the one behind it. -->
  <defs>
    <mask id="stack-halo" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="23" y="25" width="54" height="54" rx="17" fill="#000"/>
    </mask>
  </defs>
  <rect x="17" y="19" width="48" height="48" rx="14" fill="currentColor" mask="url(#stack-halo)"/>
  <rect x="26" y="28" width="48" height="48" rx="14" fill="currentColor"/>
  <path fill="currentColor" d="M 35 76 C 30.5 80.2 26.5 83.2 24.4 85.2 C 23.3 86.3 23.6 86.8 25 86.1 C 30.5 83.3 38 79.4 46.5 76 Z"/>
</svg>
