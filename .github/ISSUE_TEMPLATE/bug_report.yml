name: "🐛 Bug report / Reporte de error"
description: "Something does not work as expected · Algo no funciona como se espera"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Security problems go to [SECURITY.md](https://github.com/chat-crm-suite/.github/blob/main/SECURITY.md), not here.**
        Gracias por reportarlo. **Los problemas de seguridad van por [SECURITY.md](https://github.com/chat-crm-suite/.github/blob/main/SECURITY.md), no aquí.**
  - type: dropdown
    id: component
    attributes:
      label: "Component / Componente"
      options:
        - "chat-crm-api"
        - "chat-crm-app"
        - "chat-crm-ia"
        - "Not sure / No estoy seguro"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Version or commit / Versión o commit"
      placeholder: "v1.0.2 · e67293a"
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened? / ¿Qué pasó?"
      description: "Include what you expected instead · Incluye qué esperabas que pasara"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce / Pasos para reproducirlo"
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs or screenshots / Logs o capturas"
      description: "Remove tokens and personal data · Quita tokens y datos personales"
      render: shell
  - type: input
    id: environment
    attributes:
      label: "Environment / Entorno"
      placeholder: "Docker dev · Browser / Navegador · OS"
